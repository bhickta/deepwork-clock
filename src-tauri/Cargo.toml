[package]
name = "deepwork-clock"
version = "0.2.0-beta.1"
description = "Deepwork Clock — a calm, accessible desktop focus timer"
authors = ["Deepwork Clock contributors"]
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
name = "deepwork_clock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-notification = "2.7.0"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
deepwork-engine = { path = "src/engine" }
deepwork-core = { path = "src/core" }

# The Linux elapsed clock adapter needs `clock_gettime(CLOCK_BOOTTIME)`.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[features]
# Enables Tauri's own custom protocol; used by the bundler, not by the app.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.27.0"
tauri = { version = "2.12.5", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
