name: CI

# Continuous integration for pull requests and pushes to the default branch.
#
# The workflow is also called by the release pipeline as a quality gate, so a
# release can never be published without the same checks that run on a pull
# request.
#
# Everything here is read-only for the repository: the workflow requests
# `contents: read` only and never touches signing or publishing secrets.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:
    inputs:
      run_accessibility:
        description: "Run the Playwright and axe accessibility smoke test"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # Only pull request runs cancel each other; a release gate must never be
  # cancelled by an unrelated push.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so every job uses the same Node release as the local toolchain.
  NODE_VERSION: "24.11.1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  versions:
    name: Versions and icons
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify that every version field agrees
        run: node scripts/verify-versions.mjs --strict
      - name: Verify the native icon set
        run: node scripts/verify-icons.mjs

  frontend:
    name: Frontend (lint, typecheck, unit, build)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --run
      - name: Release tooling tests
        run: npm run test:scripts
      - name: Production build
        run: npm run build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            file \
            webkit2gtk-driver \
            dbus-x11 \
            xvfb \
            xauth \
            at-spi2-core
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The Tauri build embeds ../dist, so the frontend bundle has to exist
      # before cargo compiles the application crate.
      - name: Build the frontend bundle
        run: |
          npm ci
          npm run build
      - name: Install the pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version
      # --locked keeps the checks on the committed lock files; a lock file that
      # would need an update fails the job instead of changing silently.
      - name: Format check (application crate)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Format check (core crate)
        run: cargo fmt --manifest-path src-tauri/src/core/Cargo.toml --check
      - name: Format check (engine crate)
        run: cargo fmt --manifest-path src-tauri/src/engine/Cargo.toml --check
      - name: Clippy (application crate)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Clippy (core crate)
        run: cargo clippy --locked --manifest-path src-tauri/src/core/Cargo.toml --all-targets -- -D warnings
      - name: Clippy (engine crate)
        run: cargo clippy --locked --manifest-path src-tauri/src/engine/Cargo.toml --all-targets -- -D warnings
      - name: Test (application crate)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Test (core crate)
        run: cargo test --locked --manifest-path src-tauri/src/core/Cargo.toml
      - name: Test (engine crate)
        run: cargo test --locked --manifest-path src-tauri/src/engine/Cargo.toml
      # The native bridge check drives the real application through
      # tauri-driver and the native WebKit WebDriver. It needs a desktop
      # session, so it runs under Xvfb with an isolated D-Bus session.
      - name: Build the application for the native bridge check
        run: cargo build --manifest-path src-tauri/Cargo.toml --features custom-protocol --locked
      - name: Install the pinned tauri-driver
        run: |
          cargo install tauri-driver --version 2.1.0 --locked --root "$RUNNER_TEMP/deepwork-driver"
          # tauri-driver 2.1.0 has no --version flag, so the installed
          # version is read from the cargo install manifest instead.
          cargo install --list --root "$RUNNER_TEMP/deepwork-driver"
      - name: Run the native bridge smoke test
        shell: bash
        env:
          # Software rendering and the DMABUF workaround keep the WebKit
          # renderer usable inside the virtual frame buffer. The WebKit
          # sandbox stays enabled.
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          set -euo pipefail
          mkdir -p test-results
          runtime_dir="$RUNNER_TEMP/deepwork-xdg-runtime"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          xvfb-run -a dbus-run-session python3 scripts/native-smoke.py \
            --app src-tauri/target/debug/deepwork-clock \
            --driver "$RUNNER_TEMP/deepwork-driver/bin/tauri-driver" \
            --native-driver /usr/bin/WebKitWebDriver \
            --screenshot test-results/native-smoke.png \
            --max-runtime 35 \
            | tee test-results/native-smoke.json
      - name: Upload the native bridge result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-smoke-result
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  accessibility:
    name: DOM accessibility smoke test
    # Runs for pull requests and pushes. A reusable call can switch it off.
    if: ${{ github.event_name != 'workflow_call' || inputs.run_accessibility }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the Chromium build for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build the frontend bundle
        run: npm run build
      # Browser automation supplements, but never replaces, the manual
      # screen-reader script required by PLAN.md section 9.
      - name: Run the root accessibility smoke test
        run: npm run test:a11y
      - name: Run the frontend browser checks
        shell: bash
        run: |
          set -euo pipefail
          # The frontend browser configuration has no web server of its own,
          # so the development preview is started here on port 1421.
          npx vite --host 127.0.0.1 --port 1421 --strictPort > /tmp/preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:1421/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            echo "::error::the development preview did not start on port 1421"
            cat /tmp/preview-server.log
            exit 1
          fi
          PREVIEW_URL=http://127.0.0.1:1421 npx playwright test --config tests/frontend/browser/playwright.config.ts
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
